name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        run: |
          curl -fsSLO https://download.clojure.org/install/linux-install-1.12.5.1664.sh
          sudo bash linux-install-1.12.5.1664.sh
          clojure --version

      - name: Run tests
        run: clojure -M:test

  documentation:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build documentation PDF with OpTeX
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: '2026'
          os: debian
          run: |
            mkdir -p target/documentation
            # OpTeX recommends three runs when the table of contents is at the beginning.
            optex --interaction=nonstopmode --halt-on-error --output-directory=target/documentation state-space.tex
            optex --interaction=nonstopmode --halt-on-error --output-directory=target/documentation state-space.tex
            optex --interaction=nonstopmode --halt-on-error --output-directory=target/documentation state-space.tex

      - name: Upload documentation PDF
        uses: actions/upload-artifact@v4
        with:
          name: state-space-documentation
          path: target/documentation/state-space.pdf

  publish:
    name: Publish to Clojars
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download documentation PDF
        uses: actions/download-artifact@v4
        with:
          name: state-space-documentation
          path: target/documentation

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI
        run: |
          curl -fsSLO https://download.clojure.org/install/linux-install-1.12.5.1664.sh
          sudo bash linux-install-1.12.5.1664.sh
          clojure --version

      - name: Build and publish tagged version
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$CLOJARS_USERNAME" || -z "$CLOJARS_PASSWORD" ]]; then
            echo "Configure the CLOJARS_USERNAME and CLOJARS_PASSWORD repository secrets." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a vMAJOR.MINOR.PATCH tag, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          STATE_SPACE_VERSION="$version" clojure -T:build jar
          clojure -X:deploy
          gh release create "$GITHUB_REF_NAME" target/documentation/state-space.pdf \
            --title "State-space $version" \
            --generate-notes
